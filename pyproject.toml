[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "wargent"
version = "0.1.0"
description = "Offline command-line wargame to learn attacking and defending AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "wargent contributors" }]
keywords = [
  "ai-security",
  "llm-security",
  "prompt-injection",
  "wargame",
  "ctf",
  "agents",
  "education",
  "cybersecurity",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Education",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Education",
  "Topic :: Security",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "build>=1.2",
  "twine>=5.0",
]

[project.scripts]
wargent = "wargent.cli:app"

[project.urls]
Homepage = "https://github.com/Y0kina/wargent"
Source = "https://github.com/Y0kina/wargent"
Issues = "https://github.com/Y0kina/wargent/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/wargent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
