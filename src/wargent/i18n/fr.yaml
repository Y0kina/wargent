repl_help: |
  /help            afficher cette liste
  /info            afficher à nouveau le descriptif du niveau
  /inspect         afficher le prompt système, les outils et le contexte de l'agent
  /hint            révéler l'indice suivant
  /file CHEMIN     envoyer le contenu d'un fichier texte local comme entrée
  /submit FLAG     soumettre un flag
  /quit            quitter la session
  Utiliser \n dans un message pour insérer un retour à la ligne.
